name: Deploy to Environment

# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow: rolls TWO ECS services (ui and api) sharing the same image
# to ECS Fargate for one env.
#
# Topology: ONE container image per env, deployed to TWO ECS services in the
# same cluster. The image runs Express on PORT=5000, which serves both the API
# under /api/* and the built SPA from dist/public. Both services run the
# identical image; the ALB routes /api/* to the api target group and /* to the
# ui target group. This is a transitional shape — a future change may collapse
# back to a single service.
#
# NOTE (2026-06-14): fm-workloads-fls switched to Mode B
# (`ignore_task_definition_changes = true`). This workflow IS the source of
# truth for task revisions; Terraform no longer overwrites them on apply.
#
# Pattern: Terraform (fm-workloads-fls) owns the task definition shape (env
# vars, secrets, roles, CPU/memory, logs, container port, health check). This
# workflow only registers a new revision per family pointed at the latest
# image and updates each service to use it.
#
# Terraform-owned task definition is expected to provide:
#   env:           DATABASE_URL, SESSION_SECRET, PORT=5000, NODE_ENV=production,
#                  plus whichever auth-provider secrets the env uses
#   container:     port 5000
#   health check:  GET /health → {status: "ready"}
#
# NOTE (gap surfaced for next on-call, NOT a TODO for this workflow):
#   The app reads DATABASE_URL, SESSION_SECRET, CLERK_*, etc. at startup, and
#   runMigrations() runs before the server listens. The current Terraform task
#   definition only wires DB_HOST/DB_PORT/DB_NAME + DB_SECRET — DATABASE_URL is
#   not assembled, and the other required env vars are absent. Containers will
#   exit during runMigrations until task def shape is updated. Task def shape
#   is owned by Terraform; flagging here so the on-call has context.
#
# Required configuration:
#
#   Per-environment secrets (Settings → Environments → <name> → Secrets):
#     AWS_ROLE_ARN                  # OIDC role ARN
#     VITE_CLERK_PUBLISHABLE_KEY    # baked into the UI bundle at build time
#
#   Per-environment variables (Settings → Environments → <name> → Variables):
#     ECS_CLUSTER     # e.g. fm-fls-ecs-dev-use2  (note the -ecs- infix)
#     ENVIRONMENT_URL # (optional) Public URL shown in GH deployment view
#
# Hardcoded (no secrets needed):
#   AWS_REGION              = us-east-2 (short code: use2)
#   ECS UI service name     = fm-fls-ui-<env-short>-use2
#   ECS API service name    = fm-fls-api-<env-short>-use2
#   UI task family          = fm-fls-ui-<env-short>-use2
#   API task family         = fm-fls-api-<env-short>-use2
#   (service name == task family name in this topology)
#
# Environment → short code mapping:
#   Development → dev
#   QA          → qa
#   Production  → prod
# (Dev and QA are wired up today; reusable workflow accepts any value via wildcard.)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub Environment name (Development, QA, Production)'
        required: true
        type: string
      ui-image-uri:
        description: 'Full ECR URI for the UI repo image (with tag)'
        required: true
        type: string
      api-image-uri:
        description: 'Full ECR URI for the API repo image (with tag)'
        required: true
        type: string

env:
  AWS_REGION: us-east-2
  SHORT_REGION: use2
  PROJECT: fls

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.ENVIRONMENT_URL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Compute resource names
      id: names
      run: |
        set -euo pipefail
        ENV_LOWER=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
        case "$ENV_LOWER" in
          development) ENV_SHORT="dev" ;;
          production)  ENV_SHORT="prod" ;;
          *)           ENV_SHORT="$ENV_LOWER" ;;
        esac
        # Service name == task family name for each component.
        UI_SERVICE="fm-${{ env.PROJECT }}-ui-${ENV_SHORT}-${{ env.SHORT_REGION }}"
        API_SERVICE="fm-${{ env.PROJECT }}-api-${ENV_SHORT}-${{ env.SHORT_REGION }}"
        echo "env-short=$ENV_SHORT" >> $GITHUB_OUTPUT
        echo "env-lower=$ENV_LOWER" >> $GITHUB_OUTPUT
        echo "ui-service=$UI_SERVICE" >> $GITHUB_OUTPUT
        echo "api-service=$API_SERVICE" >> $GITHUB_OUTPUT

    - name: Build container env from GitHub Environment
      id: appenv
      # All app-bound config lives in GitHub (Settings -> Environments ->
      # <name> -> Variables / Secrets) with an APP_ prefix, e.g.
      # APP_AUTH_PROVIDER=saml becomes AUTH_PROVIDER=saml in the container.
      # The prefix separates app config from pipeline plumbing
      # (AWS_ROLE_ARN, ECS_CLUSTER, ENVIRONMENT_URL, VITE_CLERK_*, etc.).
      # Adding a new app variable later = add APP_<NAME> in the GitHub UI;
      # this workflow needs no edit.
      #
      # NOTE: secrets routed this way end up as plain values in the task
      # definition's `environment` block (visible to anyone who can
      # describe-task-definition, retained in old revisions). Accepted
      # tradeoff for now; the upgrade path is SSM/Secrets Manager + the
      # Terraform-owned `secrets` block.
      env:
        ALL_VARS: ${{ toJSON(vars) }}
        ALL_SECRETS: ${{ toJSON(secrets) }}
      run: |
        set -euo pipefail
        jq -n --argjson v "$ALL_VARS" --argjson s "$ALL_SECRETS" '
          ($v + $s)                     # secrets win a name collision
          | to_entries
          | map(select(.key | startswith("APP_")))
          | map({name: (.key | sub("^APP_"; "")), value: (.value | tostring)})
          | sort_by(.name)
        ' > app-env.json
        echo "App env var names: $(jq -r '[.[].name] | join(", ")' app-env.json)"

    - name: Register new task revision and deploy
      id: deploy
      run: |
        set -euo pipefail
        UI_SERVICE="${{ steps.names.outputs.ui-service }}"
        API_SERVICE="${{ steps.names.outputs.api-service }}"
        CLUSTER="${{ vars.ECS_CLUSTER }}"

        # -- GitHub-managed env vars (replace semantics) ---------------------
        # GitHub Environment APP_* vars/secrets are the source of truth for
        # app config (see "Build container env" step). The task definition's
        # environment is REPLACED each deploy: only the infra-provided vars
        # in KEEP_VARS survive from the previous revision, then the GitHub
        # set is appended (GitHub wins any name collision). Removing a var
        # in GitHub therefore removes it from the container on the next
        # deploy - no ratchet.
        EXTRA_ENV=$(cat app-env.json)
        KEEP_VARS='["PORT","NODE_ENV","DB_HOST","DB_PORT","DB_NAME","DATABASE_URL"]'

        # ── UI ──────────────────────────────────────────────────────────────
        echo "Describing latest revision of task family '$UI_SERVICE'..."
        aws ecs describe-task-definition --task-definition "$UI_SERVICE" \
          --query 'taskDefinition' --output json > ui-taskdef.json

        # Guard: this single-container topology assumes exactly one container
        # definition. If a sidecar is ever added, fail fast rather than silently
        # rewriting the wrong image — switch to targeting by container name then.
        UI_CONTAINERS=$(jq '.containerDefinitions | length' ui-taskdef.json)
        if [ "$UI_CONTAINERS" -ne 1 ]; then
          echo "::error::UI task definition '$UI_SERVICE' has $UI_CONTAINERS container definitions; expected exactly 1. Refusing to guess which to update."
          exit 1
        fi

        echo "Swapping UI image to ${{ inputs.ui-image-uri }}..."
        # Env replace: keep-list survivors first, GitHub set second;
        # map(last) makes the GitHub entry win any name collision.
        jq --arg img "${{ inputs.ui-image-uri }}" --argjson extra "$EXTRA_ENV" --argjson keep "$KEEP_VARS" '
          .containerDefinitions[0].image = $img |
          .containerDefinitions[0].environment =
            ((((.containerDefinitions[0].environment // [])
               | map(select(.name as $n | $keep | index($n)))) + $extra)
             | group_by(.name) | map(last)) |
          del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
              .compatibilities, .registeredAt, .registeredBy,
              .enableFaultInjection, .deregisteredAt)
        ' ui-taskdef.json > ui-taskdef-new.json

        UI_NEW_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://ui-taskdef-new.json \
          --query 'taskDefinition.taskDefinitionArn' --output text)
        echo "ui-task-arn=$UI_NEW_ARN" >> "$GITHUB_OUTPUT"
        echo "Registered UI revision: $UI_NEW_ARN"

        echo "Updating service '$UI_SERVICE' to use new revision..."
        aws ecs update-service \
          --cluster "$CLUSTER" \
          --service "$UI_SERVICE" \
          --task-definition "$UI_NEW_ARN" \
          --force-new-deployment > /dev/null

        # ── API ─────────────────────────────────────────────────────────────
        echo "Describing latest revision of task family '$API_SERVICE'..."
        aws ecs describe-task-definition --task-definition "$API_SERVICE" \
          --query 'taskDefinition' --output json > api-taskdef.json

        # Guard: same single-container assumption as the UI task (see above).
        API_CONTAINERS=$(jq '.containerDefinitions | length' api-taskdef.json)
        if [ "$API_CONTAINERS" -ne 1 ]; then
          echo "::error::API task definition '$API_SERVICE' has $API_CONTAINERS container definitions; expected exactly 1. Refusing to guess which to update."
          exit 1
        fi

        echo "Swapping API image to ${{ inputs.api-image-uri }}..."
        # Same env replace as the UI task above (GitHub wins collisions).
        jq --arg img "${{ inputs.api-image-uri }}" --argjson extra "$EXTRA_ENV" --argjson keep "$KEEP_VARS" '
          .containerDefinitions[0].image = $img |
          .containerDefinitions[0].environment =
            ((((.containerDefinitions[0].environment // [])
               | map(select(.name as $n | $keep | index($n)))) + $extra)
             | group_by(.name) | map(last)) |
          del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
              .compatibilities, .registeredAt, .registeredBy,
              .enableFaultInjection, .deregisteredAt)
        ' api-taskdef.json > api-taskdef-new.json

        API_NEW_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://api-taskdef-new.json \
          --query 'taskDefinition.taskDefinitionArn' --output text)
        echo "api-task-arn=$API_NEW_ARN" >> "$GITHUB_OUTPUT"
        echo "Registered API revision: $API_NEW_ARN"

        echo "Updating service '$API_SERVICE' to use new revision..."
        aws ecs update-service \
          --cluster "$CLUSTER" \
          --service "$API_SERVICE" \
          --task-definition "$API_NEW_ARN" \
          --force-new-deployment > /dev/null

        # ── Wait for both services to stabilize in a single call ────────────
        echo "Waiting for services to stabilize..."
        aws ecs wait services-stable \
          --cluster "$CLUSTER" \
          --services "$UI_SERVICE" "$API_SERVICE"
        echo "Deploy complete."

    - name: Deployment summary
      if: always()
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" << EOF
        ## Deployment to ${{ inputs.environment }}
        - **Cluster:** ${{ vars.ECS_CLUSTER }}
        - **URL:** ${{ vars.ENVIRONMENT_URL }}

        ### UI
        - **Service:** ${{ steps.names.outputs.ui-service }}
        - **Image:** \`${{ inputs.ui-image-uri }}\`
        - **Task revision:** ${{ steps.deploy.outputs.ui-task-arn }}

        ### API
        - **Service:** ${{ steps.names.outputs.api-service }}
        - **Image:** \`${{ inputs.api-image-uri }}\`
        - **Task revision:** ${{ steps.deploy.outputs.api-task-arn }}
        EOF
