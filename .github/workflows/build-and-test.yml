name: Build and Test

# ─────────────────────────────────────────────────────────────────────────────
# Two jobs:
#   1. test               — Node typecheck (tsc). Runs on PR and on workflow_call.
#   2. build-and-push-app — Docker build + ECR push for the single app image,
#                           tagged into TWO ECR repos (ui + api).
#                           (workflow_call only)
#
# Topology: FLS ships as ONE container — Node 20, multi-stage, built from the
# repo root (so Vite can resolve shared/* and the root configs). The image runs
# an Express server on PORT=5000 that serves both the /api/* routes AND the
# built Vite SPA out of dist/public.
#
# Deployment topology: a SINGLE Docker image is built per push, then tagged
# into TWO ECR repos (ui + api) and deployed to TWO ECS services (ui + api).
# Same image, two tag destinations, two service rollouts. This is a
# transitional state — a future change may collapse to one service.
#
# The Dockerfile lives at ./Dockerfile (build context = repo root). It is
# expected to invoke `npx vite build` + `npx esbuild ...` directly — NOT
# `npm run build`, because the package.json build script runs `npm run db:push`
# first, which requires a live DATABASE_URL (Neon) and would hard-fail in CI.
# For the same reason, the test job below runs `npm run check` (tsc only), not
# `npm run build`.
#
# Required configuration:
#
#   Per-environment secrets (Settings → Environments → <name> → Secrets):
#     AWS_ROLE_ARN                     # OIDC role ARN with ECR push permissions
#     VITE_CLERK_PUBLISHABLE_KEY       # Clerk publishable key, baked into the
#                                      # client bundle at docker build time
#   (When the Dockerfile is extended to accept more publishable Vite vars —
#   VITE_CLERK_PUBLISHABLE_KEY_PROD, VITE_GOOGLE_MAPS_API_KEY,
#   VITE_STRIPE_PUBLIC_KEY — add those as per-env secrets too and wire them
#   back into the build-args block of the build-and-push-app job below.)
#
# Hardcoded (no secrets needed):
#   AWS_REGION   = us-east-2 (short code: use2)
#   ECR repos    = fm-fls-ui-ecr-<env-short>-use2
#                  fm-fls-api-ecr-<env-short>-use2   (URIs derived at runtime)
#   ECS services = fm-fls-ui-<env-short>-use2
#                  fm-fls-api-<env-short>-use2       (managed in fm-workloads-fls)
#
# ECS task definition expectations (Terraform-owned in fm-workloads-fls):
#   env: DATABASE_URL, SESSION_SECRET, PORT=5000, NODE_ENV=production,
#        plus the auth-provider secrets the team selects.
#   container port: 5000
#   health: GET /health returns {status: 'ready'}
#
# Environment → short code mapping:
#   Development → dev
#   QA          → qa
#   Production  → prod
# (Reusable workflow remains flexible — accepts any environment name via the
# wildcard case branch.)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment name (used for image tagging and per-env Vite build)'
        required: true
        type: string
    outputs:
      ui-image-uri:
        description: 'Full ECR URI of the pushed image in the UI repo (with sha tag)'
        value: ${{ jobs.build-and-push-app.outputs.ui-image-uri }}
      api-image-uri:
        description: 'Full ECR URI of the pushed image in the API repo (with sha tag)'
        value: ${{ jobs.build-and-push-app.outputs.api-image-uri }}

  pull_request:
    branches: [ 'rel/*', freeman-dev ]

env:
  AWS_REGION: us-east-2
  SHORT_REGION: use2
  PROJECT: fls

jobs:
  # ── Job 1: Typecheck (Node/TypeScript) ─────────────────────────────────────
  # Installs dependencies and runs `npm run check` (tsc). We deliberately avoid
  # `npm run build` here because the package.json build script invokes
  # `npm run db:push` first, which requires a DATABASE_URL we don't have in CI.
  # The full bundle build is exercised inside the Dockerfile in the next job.
  test:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Upgrade npm
      # Node 20.20.x bundles npm 10.8.2, whose "Exit handler never called!"
      # bug reproducibly crashes `npm ci` partway through on this lockfile
      # (observed twice on cold-cache runs). npm 11 has the fix. The Docker
      # image stays on Node 20; only the CI install tooling is upgraded.
      run: npm install -g npm@11

    - name: Install dependencies
      # `set -e` + the require.resolve sanity check guard against partial
      # installs that exit 0 (the npm exit-handler bug above), which would
      # otherwise let tsc run against a half-installed tree and report
      # dozens of misleading "Cannot find module" errors.
      run: |
        set -euo pipefail
        npm ci --no-audit --no-fund
        node -e "['pg', 'typescript', '@neondatabase/serverless'].forEach(m => require.resolve(m))"

    - name: Typecheck (tsc)
      run: npm run check

  # ── Job 2: App Docker build + ECR push (only on workflow_call) ─────────────
  build-and-push-app:
    name: Build and push app image (${{ inputs.environment }})
    # Only build/push when invoked via workflow_call (which supplies an
    # environment). On pull_request there are no inputs, so inputs.environment
    # is '' — but we also guard on event_name to make the intent explicit so
    # ECR push / environment secrets are never reached on a PR.
    # NOTE: in a reusable (called) workflow github.event_name is the CALLER's
    # original event (e.g. 'push' / 'workflow_dispatch'), never 'workflow_call',
    # so we exclude 'pull_request' rather than require 'workflow_call'.
    if: github.event_name != 'pull_request' && inputs.environment != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ inputs.environment }}
    outputs:
      ui-image-uri: ${{ steps.uri.outputs.ui-image-uri }}
      api-image-uri: ${{ steps.uri.outputs.api-image-uri }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Compute ECR URI and image tags
      id: meta
      run: |
        set -euo pipefail
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        SHORT_SHA=$(git rev-parse --short HEAD)
        ENV_LOWER=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
        case "$ENV_LOWER" in
          development) ENV_SHORT="dev" ;;
          production)  ENV_SHORT="prod" ;;
          *)           ENV_SHORT="$ENV_LOWER" ;;
        esac
        UI_REPO_NAME="fm-${{ env.PROJECT }}-ui-ecr-${ENV_SHORT}-${{ env.SHORT_REGION }}"
        API_REPO_NAME="fm-${{ env.PROJECT }}-api-ecr-${ENV_SHORT}-${{ env.SHORT_REGION }}"
        UI_REPO="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${UI_REPO_NAME}"
        API_REPO="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${API_REPO_NAME}"
        echo "ui-repo=$UI_REPO" >> $GITHUB_OUTPUT
        echo "api-repo=$API_REPO" >> $GITHUB_OUTPUT
        echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "env-short=$ENV_SHORT" >> $GITHUB_OUTPUT
        echo "::notice::App build for '$ENV_SHORT' → ui-repo=$UI_REPO api-repo=$API_REPO sha=$SHORT_SHA"

    - name: Build and push app image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # NOTE: The freeman-dev Dockerfile currently only declares
        # ARG VITE_CLERK_PUBLISHABLE_KEY. Once the Dockerfile is extended to
        # accept the other publishable Vite vars (CLERK_PUBLISHABLE_KEY_PROD,
        # GOOGLE_MAPS_API_KEY, STRIPE_PUBLIC_KEY), add them back here as
        # additional build-args so Vite bakes them into the client bundle.
        build-args: |
          VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        tags: |
          ${{ steps.meta.outputs.ui-repo }}:${{ steps.meta.outputs.sha }}
          ${{ steps.meta.outputs.ui-repo }}:${{ steps.meta.outputs.env-short }}-latest
          ${{ steps.meta.outputs.api-repo }}:${{ steps.meta.outputs.sha }}
          ${{ steps.meta.outputs.api-repo }}:${{ steps.meta.outputs.env-short }}-latest
        cache-from: type=gha,scope=app
        cache-to: type=gha,mode=max,scope=app

    - name: Set image URI output
      id: uri
      run: |
        echo "ui-image-uri=${{ steps.meta.outputs.ui-repo }}:${{ steps.meta.outputs.sha }}" >> $GITHUB_OUTPUT
        echo "api-image-uri=${{ steps.meta.outputs.api-repo }}:${{ steps.meta.outputs.sha }}" >> $GITHUB_OUTPUT
